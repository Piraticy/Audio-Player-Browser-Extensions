services:
  audio-player:
    build: .
    image: auralith-studio:local
    pull_policy: build
    container_name: auralith-studio-dev
    command: python3 web/server.py --host 0.0.0.0 --port 8091
    ports:
      - "8091:8091"
    volumes:
      - .:/app

  audio-player-test:
    build: .
    image: auralith-studio:local
    pull_policy: build
    command: python3 scripts/docker_smoke_test.py
    volumes:
      - .:/app
